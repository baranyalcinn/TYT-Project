spring:
  application:
    name: product-service
  profiles:
    active: dev

  main:
    lazy-initialization: true
  jpa:
    hibernate:
      ddl-auto: update
  jmx:
    enabled: false

server:
  port: 8081
  servlet:
    context-path: /product-service

logging:
  level:
    tyt.product: INFO
  file:
    name: app/logs/product.log

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true